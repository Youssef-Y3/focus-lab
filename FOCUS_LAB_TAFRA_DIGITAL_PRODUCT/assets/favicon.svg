<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F1117"/>
      <stop offset="100%" stop-color="#181B26"/>
    </linearGradient>
    <linearGradient id="prismAura" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B35"/>
      <stop offset="50%" stop-color="#FFA826"/>
      <stop offset="100%" stop-color="#00D2FF"/>
    </linearGradient>
    <linearGradient id="coreBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF6B35"/>
      <stop offset="100%" stop-color="#00F0FF"/>
    </linearGradient>
    <filter id="coreGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Deep Obsidian Rounded Container -->
  <rect width="100" height="100" rx="24" fill="url(#bgGrad)"/>
  <rect x="2" y="2" width="96" height="96" rx="22" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

  <!-- Geometric Focus Aperture Facets -->
  <g transform="translate(50, 50)">
    <!-- Outer Precision Hexagon -->
    <polygon points="0,-36 31.18,-18 31.18,18 0,36 -31.18,18 -31.18,-18" 
             stroke="rgba(255,255,255,0.18)" stroke-width="1.5" fill="none"/>
             
    <!-- Inner Converging Aperture Blades -->
    <path d="M0,-36 L18,-10 L-6,-8 Z" fill="rgba(255, 107, 53, 0.25)"/>
    <path d="M31.18,-18 L18,10 L10,-4 Z" fill="rgba(255, 168, 38, 0.3)"/>
    <path d="M31.18,18 L0,20 L16,6 Z" fill="rgba(0, 210, 255, 0.25)"/>
    <path d="M0,36 L-18,10 L6,8 Z" fill="rgba(0, 240, 255, 0.3)"/>
    <path d="M-31.18,18 L-18,-10 L-10,4 Z" fill="rgba(255, 107, 53, 0.3)"/>
    <path d="M-31.18,-18 L0,-20 L-16,-6 Z" fill="rgba(255, 168, 38, 0.25)"/>

    <!-- Central Quantum Core / Tafra Spark -->
    <circle cx="0" cy="0" r="10" fill="url(#prismAura)" filter="url(#coreGlow)"/>
    <circle cx="0" cy="0" r="5" fill="#FFFFFF"/>

    <!-- Dynamic Focal Precision Crosshair Reticle -->
    <line x1="-24" y1="0" x2="-14" y2="0" stroke="url(#coreBeam)" stroke-width="2" stroke-linecap="round"/>
    <line x1="14" y1="0" x2="24" y2="0" stroke="url(#coreBeam)" stroke-width="2" stroke-linecap="round"/>
    <line x1="0" y1="-24" x2="0" y2="-14" stroke="url(#coreBeam)" stroke-width="2" stroke-linecap="round"/>
    <line x1="0" y1="14" x2="0" y2="24" stroke="url(#coreBeam)" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>